<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle radial gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070c0c" stop-opacity="0" />
    </radialGradient>

    <!-- Outer border gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#20b2aa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Letter T Gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#20b2aa" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Dot Accent Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="#080e0e" />
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#borderGlow)" stroke-width="10" stroke-opacity="0.85" />

  <!-- Monogram Group -->
  <g id="monogram">
    <!-- Letter T -->
    <path
      d="M 96,152 C 96,140.95 104.95,132 116,132 L 236,132 C 247.05,132 256,140.95 256,152 L 256,168 C 256,179.05 247.05,188 236,188 L 196,188 L 196,356 C 196,367.05 187.05,376 176,376 L 156,376 C 144.95,376 136,367.05 136,356 L 136,188 L 116,188 C 104.95,188 96,179.05 96,168 Z"
      fill="url(#tGrad)"
    />

    <!-- Letter A -->
    <path
      d="M 314,134 C 324.2,134 332.8,141.7 334.3,151.8 L 372.5,357 C 374.3,366.8 367.1,376 357.2,376 L 332,376 C 323,376 315.4,370 313.4,361.3 L 303.4,316 L 248.6,316 L 238.6,361.3 C 236.6,370 229,376 220,376 L 194.8,376 C 184.9,376 177.7,366.8 179.5,357 L 217.7,151.8 C 219.2,141.7 227.8,134 238,134 Z M 276,212 L 258,280 L 294,280 Z"
      fill="url(#aGrad)"
    />

    <!-- Accent Dot "." (Glowing turquoise) -->
    <circle cx="406" cy="358" r="22" fill="url(#dotGrad)" filter="url(#glow)" />
    <circle cx="406" cy="358" r="18" fill="url(#dotGrad)" />
  </g>
</svg>